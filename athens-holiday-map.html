  'Sep 20':['National Archaeological Museum','Exarchia Square','Ama Lachei','Warehouse','Pharaoh'],
  'Sep 21':['Kerameikos','Ta Karamanlidika tou Fani','Monastiraki Square','Ancient Agora','Stoa of Attalos','Oikonomou Taverna'],
  'Sep 22':['Anafiotika','Roman Agora','Acropolis of Athens','Odeon of Herodes Atticus','Acropolis Museum','Mani Mani'],
  'Sep 23':['Benaki Museum of Greek Culture','Syntagma Square','National Garden','Panathenaic Stadium','Mavro Provato','Temple of Olympian Zeus',"Hadrian's Arch"],
  'Island':['Piraeus ferry departure area','Aegina port','Temple of Aphaia','Perdika port','Moni Island','Piraeus Port — dönüş'],
  'Sep 25':['Platanos Taverna','Saita Taverna','To Kafeneio','Philopappos Monument','To Kati Allo'],
  'Sep 26':['Takis Bakery','Syngrou-Fix metro',airportName]
};
function match(p,f){
  if(f==='all')return true;
  if(f==='athens')return p.day!=='Island'&&p.name!==airportName;
  const common=p.day==='Base'||(p.day==='Transit'&&p.name!==airportName);
  return p.day===f||common||((f==='Sep 19'||f==='Sep 26')&&p.name===airportName);
}
function navUrl(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+', '+(p.day==='Island'?'Greece':'Athens Greece'))}
function placeName(p){return p.day==='Base'?'Konaklama üssü — Veikou 52, Koukaki':p.name}
function kindName(p){return kindLabel[p.kind]||p.kind}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function routeStops(f){
  const byName=new Map(places.map(p=>[p.name,p]));
  return (routeCandidates[f]||[])
    .map(name=>byName.get(name))
    .filter(Boolean);
}
function kilometers(a,b){const r=6371;const dLat=(b.lat-a.lat)*Math.PI/180;const dLon=(b.lon-a.lon)*Math.PI/180;const q=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;return 2*r*Math.asin(Math.sqrt(q))}
function legMode(a,b,f,km){
  if(a.name===airportName||b.name===airportName)return 'Metro ve yürüyüş (yaklaşık 55–70 dk)';
  if(f==='Island'){
    if(a.name==='Moni Island'&&b.name==='Piraeus Port — dönüş')return 'Tekne ile Perdika, ardından Piraeus’a feribot';
    if(a.name==='Moni Island'||b.name==='Moni Island')return 'Perdika’dan tekne (yaklaşık 8 dk)';
    if(a.name==='Temple of Aphaia'||b.name==='Temple of Aphaia')return 'Aegina yerel otobüsü veya taksi';
    if(a.name==='Perdika port'||b.name==='Perdika port')return 'Aegina yerel otobüsü veya taksi';
    if(a.name.includes('departure')||b.name.includes('port'))return 'Feribot';
  }
  if(km<=1.4)return 'Yürüyüş';
  return 'Yürüyüş veya toplu taşıma';
}
function directionsUrl(stops,f){const mode=(f==='Island'||f==='Sep 19'||f==='Sep 26')?'transit':'walking';const point=p=>p.lat+','+p.lon;const url=new URL('https://www.google.com/maps/dir/');url.searchParams.set('api','1');url.searchParams.set('origin',point(stops[0]));url.searchParams.set('destination',point(stops.at(-1)));url.searchParams.set('travelmode',mode);if(stops.length>2)url.searchParams.set('waypoints',stops.slice(1,-1).map(point).join('|'));return url.toString()}
function drawSummary(f){
  const panel=document.getElementById('routeSummary');const stops=routeStops(f);
  if(stops.length<2){panel.innerHTML='<h3>Günlük rota özeti</h3><p>Mesafe, adım ve çok duraklı yol tarifi için bir gün seçin.</p>';return}
  const legs=stops.slice(1).map((to,i)=>{const from=stops[i];const direct=kilometers(from,to);const adjusted=direct*(f==='Island'?1.1:1.25);return {from,to,km:adjusted,mode:legMode(from,to,f,direct)}});
  const total=legs.reduce((sum,leg)=>sum+leg.km,0);const walking=legs.filter(leg=>leg.mode==='Yürüyüş').reduce((sum,leg)=>sum+leg.km,0);const steps=Math.round(walking*1350/100)*100;
  const home=places.find(p=>p.name===baseName);const farthest=kilometers(home,stops[0]);const nearest=kilometers(home,stops.at(-1));
  panel.innerHTML='<h3>'+escapeHtml(dayLabel[f])+' rota özeti</h3><p class="metrics">Evden uzağa göre sıralandı: <strong>'+escapeHtml(placeName(stops[0]))+'</strong> ile başlar, <strong>'+escapeHtml(placeName(stops.at(-1)))+'</strong> ile biter.<br>Başlangıç: evden yaklaşık '+farthest.toFixed(1)+' km · Son durak: evden yaklaşık '+nearest.toFixed(1)+' km<br>Toplam rota: yaklaşık '+total.toFixed(1)+' km<br>Yürüyüş: yaklaşık '+walking.toFixed(1)+' km · '+steps.toLocaleString('tr-TR')+' adım</p><ol>'+legs.map(leg=>'<li><strong>'+escapeHtml(placeName(leg.from))+'</strong> → <strong>'+escapeHtml(placeName(leg.to))+'</strong><br>'+escapeHtml(leg.mode)+' · yaklaşık '+leg.km.toFixed(1)+' km</li>').join('')+'</ol><a class="route-link" href="'+directionsUrl(stops,f)+'" target="_blank" rel="noopener">Tüm durakları Google Maps’te aç</a><p class="route-note">Mesafeler yaklaşık değerlerdir. Havalimanı ve feribot bölümleri adım hesabına dahil değildir.</p>';
  const metric=workbookMetrics[f];
  if(metric){
    const note=metric.note?' · '+metric.note:'';
    panel.querySelector('.metrics').innerHTML='Çalışma kitabındaki rota sırası: <strong>'+escapeHtml(placeName(stops[0]))+'</strong> ile başlar, <strong>'+escapeHtml(placeName(stops.at(-1)))+'</strong> ile biter.<br>Toplam: yaklaşık '+metric.km.toLocaleString('tr-TR')+' km · '+metric.steps.toLocaleString('tr-TR')+' adım'+escapeHtml(note);
    panel.querySelector('.metrics').innerHTML='Çalışma kitabındaki rota sırası: <strong>'+escapeHtml(placeName(stops[0]))+'</strong> ile başlar, <strong>'+escapeHtml(placeName(stops.at(-1)))+'</strong> ile biter.<br>Seçili gün için tahmini yürüyüş: <strong>'+metric.km.toLocaleString('tr-TR')+' km</strong> · '+metric.steps.toLocaleString('tr-TR')+' adım'+escapeHtml(note);
  }
}
function draw(f){
  dots.clearLayers();active=[];
  const mapped=places.filter(p=>match(p,f));
  const itinerary=routeStops(f);
  const listed=itinerary.length?itinerary:mapped;
  const pins=new Map();
  const list=document.getElementById('list');list.innerHTML='';
  for(const p of mapped){
    const color=colors[p.day]||'#777';
    const pin=L.circleMarker([p.lat,p.lon],{radius:p.day==='Base'?10:7,color:'#fff',weight:2,fillColor:color,fillOpacity:.95}).addTo(dots);
    pin.bindPopup('<strong>'+escapeHtml(placeName(p))+'</strong><br>'+escapeHtml(kindName(p))+'<br><small>'+escapeHtml(dayLabel[p.day])+'</small><br><a href="'+navUrl(p)+'" target="_blank" rel="noopener">Google Maps’te aç ↗</a>');
    pins.set(p.name,pin);active.push(pin);
  }
  for(const p of listed){
    const b=document.createElement('button');b.className='place';b.innerHTML=escapeHtml(placeName(p))+'<span>'+escapeHtml(kindName(p))+'</span>';
    b.onclick=()=>{const pin=pins.get(p.name);map.setView([p.lat,p.lon],Math.max(map.getZoom(),15));pin?.openPopup()};list.appendChild(b);
  }
document.getElementById('listTitle').textContent=f==='athens'?'Atina noktaları':f==='all'?'Tüm noktalar':f==='Island'?'Ada limanları ve yemek mekânları':dayLabel[f]+' durakları';
if(f==='Island')document.getElementById('listTitle').textContent='Saronic Islands rota durakları';
drawSummary(f);
if(f==='athens')map.fitBounds([[37.962,23.710],[37.992,23.748]],{padding:[20,20]});else if(f==='Island')map.fitBounds([[37.345,23.42],[37.955,23.71]],{padding:[25,25]});else if(active.length>1)map.fitBounds(L.featureGroup(active).getBounds().pad(.18),{padding:[20,20],maxZoom:15});
for(const button of document.querySelectorAll('[data-filter]'))button.setAttribute('aria-pressed',button.dataset.filter===f?'true':'false');}
for(const button of document.querySelectorAll('[data-filter]')){const color=colors[button.dataset.filter];if(color){button.classList.add('day-filter');button.style.setProperty('--day-color',color)}button.addEventListener('click',()=>draw(button.dataset.filter))}draw('athens');
</script></body></html>
